<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no Github</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png" alt="Logo do GitHub">
        </div>
    </header>

    <main>
        <section class="login-container">

            <h1>Entrar no Github</h1>

            <form>
                <div>
                    <label for="email">Nome de usuário ou endereço de e-mail</label>
                    <input type="text" id="email" name="email">
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha">
                </div>

                <button type="submit">Entrar</button>
            </form>

            <p>
                <a href="#">Esqueceu sua senha?</a>
            </p>

            <div class="create-account">
                <p>
                    Novo no Github?
                    <a href="#">Criar uma conta</a>
                </p>
            </div>

        </section>
    </main>
    <footer>
    <nav>
        <a href="#">Termos</a>
        <a href="#">Privacidade</a>
        <a href="#">Segurança</a>
        <a href="#">Contato</a>
    </nav>
</footer>

</body>

</html>
