<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no GitHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png" alt="Logo do GitHub">
        </div>
    </header>

    <main>
        <section class="login-container">

            <h1>Entrar no GitHub</h1>

            <form>
                <div>
                    <label for="email">Nome de usuário ou endereço de e-mail</label>
                    <input type="text" id="email" name="email">
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha">
                </div>

                <button type="submit">Entrar</button>
            </form>

            <p>
                <a href="#">Esqueceu sua senha?</a>
            </p>

            <div class="create-account">
                <p>
                    Novo no GitHub?
                    <a href="#">Criar uma conta</a>
                </p>
            </div>

        </section>
        <section class="sobre-projeto">
    <h2>Sobre este projeto</h2>
    <p>
        Página desenvolvida por Samuel como parte de um projeto acadêmico
        de Front-End,inspirado na página de login do GitHub.
    </p>
</section>
    </main>

    <footer>
        <nav>
            <a href="#">Termos</a>
            <a href="#">Privacidade</a>
            <a href="#">Segurança</a>
            <a href="#">Contato</a>
        </nav>
    </footer>

</body>

</html>
